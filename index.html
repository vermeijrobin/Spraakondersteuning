<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AAC Expressive Communication Assistant</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- WebGazer.js Eye Tracking Library -->
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

  <style>
    :root {
      --bg-primary: #f0f4f8;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --focus-ring: #2563eb;
      --card-radius: 18px;
      
      --color-yes: #22c55e;
      --color-no: #ef4444;
      --color-maybe: #f59e0b;
      --color-wait: #8b5cf6;
      
      --dwell-border: #2563eb;
      --dwell-duration: 3000ms;
    }

    body.high-contrast {
      --bg-primary: #000000;
      --bg-card: #121212;
      --text-main: #ffffff;
      --text-muted: #e2e8f0;
      --border-color: #ffffff;
      --focus-ring: #ffff00;
      
      --color-yes: #00ff00;
      --color-no: #ff0000;
      --color-maybe: #ffaa00;
      --color-wait: #aa00ff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background-color: var(--bg-card);
      padding: 12px 20px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--focus-ring);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-toggle {
      background-color: var(--bg-primary);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-toggle.active {
      background-color: var(--focus-ring);
      color: #ffffff;
      border-color: var(--focus-ring);
    }

    /* Pinned Quick Response Bar */
    .quick-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--border-color);
    }

    .quick-btn {
      border: 3px solid transparent;
      border-radius: var(--card-radius);
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 18px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .quick-btn i { font-size: 2rem; pointer-events: none; }
    .quick-btn span { pointer-events: none; }
    .quick-btn.yes { background-color: var(--color-yes); }
    .quick-btn.no { background-color: var(--color-no); }
    .quick-btn.maybe { background-color: var(--color-maybe); }
    .quick-btn.wait { background-color: var(--color-wait); }

    /* Live Message Banner */
    .message-banner {
      background-color: var(--bg-card);
      margin: 12px 14px 0 14px;
      padding: 14px 18px;
      border-radius: var(--card-radius);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
    }

    .message-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .message-actions {
      display: flex;
      gap: 8px;
    }

    .action-icon-btn {
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      position: relative;
    }

    /* Category Tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .tab-btn.active {
      border-color: var(--focus-ring);
      color: var(--focus-ring);
      background-color: rgba(37, 99, 235, 0.08);
    }

    /* Cards Container */
    .cards-container {
      padding: 8px 14px 30px 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      flex: 1;
    }

    .comm-card {
      background-color: var(--bg-card);
      border: 3px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .comm-card i { font-size: 2.5rem; color: var(--focus-ring); pointer-events: none; }
    .comm-card span { font-size: 1.1rem; font-weight: 800; line-height: 1.2; pointer-events: none; }

    /* Visual Eye Pointer Reticle */
    #gazePointer {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(236, 72, 153, 0.4);
      border: 4px solid #db2777;
      box-shadow: 0 0 20px rgba(219, 39, 119, 0.9);
      pointer-events: none !important;
      z-index: 9999999;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.4rem;
      transition: top 0.1s ease-out, left 0.1s ease-out;
    }

    #gazePointer.hidden { display: none !important; }

    /* Dwell Ring Progress Animation */
    .dwell-progress-ring {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none !important;
      border-radius: inherit;
      border: 8px solid transparent;
      box-sizing: border-box;
    }

    .dwelling .dwell-progress-ring {
      border-color: var(--dwell-border);
      animation: fillDwell var(--dwell-duration, 3000ms) linear forwards;
    }

    @keyframes fillDwell {
      0% { clip-path: polygon(50% 50%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%); }
      25% { clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%, 100% 50%, 100% 50%); }
      50% { clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 100% 100%, 100% 100%); }
      75% { clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 100%); }
      100% { clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%); }
    }

    /* Auto Scan Highlight */
    .scanning-active .comm-card.scan-focused,
    .scanning-active .quick-btn.scan-focused,
    .scanning-active .tab-btn.scan-focused {
      outline: 6px solid var(--focus-ring) !important;
      outline-offset: -6px;
      transform: scale(1.03);
      z-index: 10;
    }

    /* Permission Modal */
    .permission-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(15, 23, 42, 0.95);
      z-index: 99999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      text-align: center;
    }

    .permission-box {
      background-color: var(--bg-card);
      color: var(--text-main);
      padding: 30px;
      border-radius: var(--card-radius);
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .permission-box i { font-size: 3.5rem; color: var(--focus-ring); }

    /* Interactive 5-Point Calibration Screen Overlay */
    .calibration-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.94);
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .calib-instructions {
      max-width: 500px;
      margin-bottom: 20px;
    }

    .calib-dot {
      width: 50px;
      height: 50px;
      background-color: #ef4444;
      border: 4px solid white;
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      transition: background-color 0.2s, transform 0.2s;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .calib-dot.done {
      background-color: #22c55e !important;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
    }

    .hidden { display: none !important; }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-content {
      background-color: var(--bg-card);
      border-radius: var(--card-radius);
      padding: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; }
    .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }

    @media (max-width: 600px) {
      .quick-btn { font-size: 1.1rem; padding: 12px 4px; }
      .quick-btn i { font-size: 1.5rem; }
      .cards-container { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Visual Gaze Pointer Reticle -->
  <div id="gazePointer" class="hidden">
    <i class="fa-solid fa-crosshairs"></i>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-comments"></i>
      <span id="appTitle">AAC Voice</span>
    </div>

    <div class="header-actions">
      <!-- Language Selector -->
      <button class="btn-toggle" id="langBtn" onclick="toggleLanguage()">
        <i class="fa-solid fa-globe"></i>
        <span id="langLabel">EN / NL</span>
      </button>

      <!-- Eye Tracking Toggle -->
      <button class="btn-toggle" id="eyeTrackBtn" onclick="requestCameraPermissionAndStart()">
        <i class="fa-solid fa-eye"></i>
        <span id="eyeTrackLabel">Eye Tracking</span>
      </button>

      <!-- Auto Scan Toggle -->
      <button class="btn-toggle" id="scanBtn" onclick="toggleAutoScan()">
        <i class="fa-solid fa-sliders"></i>
        <span id="scanLabel">Auto Scan</span>
      </button>

      <!-- Settings -->
      <button class="btn-toggle" onclick="openSettings()">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- Pinned Direct Answers Bar -->
  <div class="quick-bar">
    <button class="quick-btn yes" onclick="speakPhrase('Yes', 'Ja')">
      <div class="dwell-progress-ring"></div>
      <i class="fa-solid fa-circle-check"></i>
      <span data-en="YES" data-nl="JA">YES</span>
    </button>
    <button class="quick-btn no" onclick="speakPhrase('No', 'Nee')">
      <div class="dwell-progress-ring"></div>
      <i class="fa-solid fa-circle-xmark"></i>
      <span data-en="NO" data-nl="NEE">NO</span>
    </button>
    <button class="quick-btn maybe" onclick="speakPhrase('Maybe', 'Misschien')">
      <div class="dwell-progress-ring"></div>
      <i class="fa-solid fa-circle-question"></i>
      <span data-en="MAYBE" data-nl="MISSCHIEN">MAYBE</span>
    </button>
    <button class="quick-btn wait" onclick="speakPhrase('Wait please', 'Wacht alsjeblieft')">
      <div class="dwell-progress-ring"></div>
      <i class="fa-solid fa-hand"></i>
      <span data-en="WAIT" data-nl="WACHT">WAIT</span>
    </button>
  </div>

  <!-- Live Message Banner -->
  <div class="message-banner">
    <div class="message-text" id="messageDisplay" data-en="Look at a button for 3 seconds..." data-nl="Kijk 3 seconden naar een knop...">
      Look at a button for 3 seconds...
    </div>
    <div class="message-actions">
      <button class="action-icon-btn" onclick="reSpeakCurrentMessage()" title="Speak Again">
        <div class="dwell-progress-ring"></div>
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="action-icon-btn" onclick="clearMessage()" title="Clear">
        <div class="dwell-progress-ring"></div>
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="category-tabs" id="categoryTabs"></div>

  <!-- Grid Cards -->
  <div class="cards-container" id="cardsContainer"></div>

  <!-- Camera Permission Prompt Dialog -->
  <div id="permissionModal" class="permission-modal hidden">
    <div class="permission-box">
      <i class="fa-solid fa-camera"></i>
      <h2 data-en="Camera Permission Required" data-nl="Cameratoegang Vereist">Camera Permission Required</h2>
      <p data-en="To enable Eye Tracking, this app needs camera access. No video leaves your device." data-nl="Om oogbesturing in te schakelen heeft deze app cameratoegang nodig. Er worden geen beelden opgeslagen.">
        To enable Eye Tracking, this app needs camera access. No video leaves your device.
      </p>
      <div style="display: flex; gap: 12px; margin-top: 10px;">
        <button class="btn-toggle active" style="padding: 12px 20px;" onclick="confirmCameraPermission()" data-en="Allow Camera" data-nl="Camera Toestaan">
          Allow Camera
        </button>
        <button class="btn-toggle" style="padding: 12px 20px;" onclick="cancelCameraPermission()" data-en="Cancel" data-nl="Annuleren">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Interactive 5-Point Calibration Screen Overlay -->
  <div id="calibrationOverlay" class="calibration-overlay hidden">
    <div class="calib-instructions">
      <h2 data-en="Eye-Tracking Calibration" data-nl="Oogbesturing Calibratie">Eye-Tracking Calibration</h2>
      <p data-en="Look directly at each red dot and click it 5 times while looking at it." data-nl="Kijk direct naar elke rode stip en klik er 5 keer op terwijl je ernaar kijkt.">
        Look directly at each red dot and click it 5 times while looking at it.
      </p>
    </div>
    
    <div class="calib-dot" style="top: 15%; left: 15%;" onclick="clickCalibDot(this, event)">5</div>
    <div class="calib-dot" style="top: 15%; left: 85%;" onclick="clickCalibDot(this, event)">5</div>
    <div class="calib-dot" style="top: 50%; left: 50%;" onclick="clickCalibDot(this, event)">5</div>
    <div class="calib-dot" style="top: 85%; left: 15%;" onclick="clickCalibDot(this, event)">5</div>
    <div class="calib-dot" style="top: 85%; left: 85%;" onclick="clickCalibDot(this, event)">5</div>

    <button class="btn-toggle" style="margin-top: 30px; font-size: 1.1rem; padding: 12px 24px;" onclick="finishCalibration()" data-en="Complete Calibration" data-nl="Calibratie Voltooien">
      Complete Calibration
    </button>
  </div>

  <!-- Caregiver Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2 data-en="Settings" data-nl="Instellingen">Settings</h2>
      
      <div class="form-group">
        <label data-en="Gaze Dwell Time (Seconds)" data-nl="Fixatietijd (Seconden)">Gaze Dwell Time</label>
        <select id="dwellSelect" onchange="updateDwellTime(this.value)">
          <option value="2000">2.0s</option>
          <option value="3000" selected>3.0s (Recommended)</option>
          <option value="4000">4.0s</option>
        </select>
      </div>

      <div class="form-group">
        <label data-en="High Contrast Theme" data-nl="Hoog Contrast Thema">High Contrast Theme</label>
        <button class="btn-toggle" onclick="toggleHighContrast()" data-en="Toggle Contrast" data-nl="Contrast Wisselen">Toggle Contrast</button>
      </div>

      <div class="form-group">
        <label data-en="Recalibrate Eye Tracker" data-nl="Hercalibreer Oogbesturing">Recalibrate</label>
        <button class="btn-toggle" onclick="startCalibration()" data-en="Start Calibration" data-nl="Start Calibratie">Start Calibration</button>
      </div>

      <div style="text-align: right; margin-top: 20px;">
        <button class="btn-toggle active" onclick="closeSettings()" data-en="Close" data-nl="Sluiten">Close</button>
      </div>
    </div>
  </div>

  <!-- Application Script -->
  <script>
    let currentLang = 'en';
    let isEyeTrackingActive = false;
    let isAutoScanning = false;
    let scanIndex = 0;
    let scanInterval = null;
    let scanSpeed = 2000;
    let dwellDuration = 3000;
    
    let currentGazeElement = null;
    let dwellTimer = null;
    let currentMessageText = '';

    const categories = [
      { id: 'needs', en: 'Core Needs', nl: 'Basisseisen', icon: 'fa-hand-holding-heart' },
      { id: 'feelings', en: 'Feelings', nl: 'Gevoelens', icon: 'fa-face-smile' },
      { id: 'activities', en: 'Activities', nl: 'Activiteiten', icon: 'fa-person-walking' }
    ];

    const cardsData = [
      { cat: 'needs', icon: 'fa-utensils', enLabel: 'Hungry', nlLabel: 'Honger', enPhrase: 'I am hungry', nlPhrase: 'Ik heb honger' },
      { cat: 'needs', icon: 'fa-glass-water', enLabel: 'Thirsty', nlLabel: 'Dorst', enPhrase: 'I am thirsty', nlPhrase: 'Ik heb dorst' },
      { cat: 'needs', icon: 'fa-restroom', enLabel: 'Toilet', nlLabel: 'Toilet', enPhrase: 'I need to go to the toilet', nlPhrase: 'Ik moet naar het toilet' },
      { cat: 'needs', icon: 'fa-bed', enLabel: 'Tired', nlLabel: 'Moe', enPhrase: 'I am tired', nlPhrase: 'Ik ben moe' },
      { cat: 'needs', icon: 'fa-pills', enLabel: 'Medicine', nlLabel: 'Medicijn', enPhrase: 'I need my medicine', nlPhrase: 'Ik heb mijn medicijnen nodig' },
      { cat: 'needs', icon: 'fa-heart-pulse', enLabel: 'Pain', nlLabel: 'Pijn', enPhrase: 'I am in pain', nlPhrase: 'Ik heb pijn' },

      { cat: 'feelings', icon: 'fa-face-smile-beam', enLabel: 'Happy', nlLabel: 'Blij', enPhrase: 'I feel happy', nlPhrase: 'Ik voel me blij' },
      { cat: 'feelings', icon: 'fa-face-frown', enLabel: 'Sad', nlLabel: 'Verdrietig', enPhrase: 'I feel sad', nlPhrase: 'Ik voel me verdrietig' },
      { cat: 'feelings', icon: 'fa-face-angry', enLabel: 'Angry', nlLabel: 'Boos', enPhrase: 'I feel angry', nlPhrase: 'Ik ben boos' },
      { cat: 'feelings', icon: 'fa-face-flushed', enLabel: 'Overwhelmed', nlLabel: 'Overweldigd', enPhrase: 'I feel overwhelmed', nlPhrase: 'Ik voel me overweldigd' },

      { cat: 'activities', icon: 'fa-tv', enLabel: 'Watch TV', nlLabel: 'TV Kijken', enPhrase: 'I want to watch TV', nlPhrase: 'Ik wil tv kijken' },
      { cat: 'activities', icon: 'fa-tree', enLabel: 'Outside', nlLabel: 'Buiten', enPhrase: 'I want to go outside', nlPhrase: 'Ik wil naar buiten' },
      { cat: 'activities', icon: 'fa-music', enLabel: 'Music', nlLabel: 'Muziek', enPhrase: 'I want to listen to music', nlPhrase: 'Ik wil naar muziek luisteren' }
    ];

    let activeCategory = 'needs';

    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      renderCards();
      document.styleSheets[0].insertRule(`:root { --dwell-duration: ${dwellDuration}ms; }`, 0);
    });

    function renderTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = categories.map(cat => `
        <button class="tab-btn ${cat.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
          <div class="dwell-progress-ring"></div>
          <i class="fa-solid ${cat.icon}"></i>
          <span>${currentLang === 'en' ? cat.en : cat.nl}</span>
        </button>
      `).join('');
    }

    function selectCategory(catId) {
      activeCategory = catId;
      renderTabs();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const filtered = cardsData.filter(c => c.cat === activeCategory);

      container.innerHTML = filtered.map(card => {
        const label = currentLang === 'en' ? card.enLabel : card.nlLabel;
        return `
          <div class="comm-card" onclick="speakPhrase('${card.enPhrase}', '${card.nlPhrase}')">
            <div class="dwell-progress-ring"></div>
            <i class="fa-solid ${card.icon}"></i>
            <span>${label}</span>
          </div>
        `;
      }).join('');
    }

    // TTS Voice Engine
    function speakPhrase(enText, nlText) {
      const textToSpeak = currentLang === 'en' ? enText : nlText;
      currentMessageText = textToSpeak;
      document.getElementById('messageDisplay').innerText = textToSpeak;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = currentLang === 'en' ? 'en-US' : 'nl-NL';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function reSpeakCurrentMessage() {
      if (currentMessageText) speakPhrase(currentMessageText, currentMessageText);
    }

    function clearMessage() {
      currentMessageText = '';
      document.getElementById('messageDisplay').innerText = currentLang === 'en' ? 'Look at a button for 3 seconds...' : 'Kijk 3 seconden naar een knop...';
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'nl' : 'en';
      document.querySelectorAll('[data-en]').forEach(el => {
        el.innerText = currentLang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-nl');
      });
      renderTabs();
      renderCards();
      clearMessage();
    }

    // Camera Request & Tracking
    function requestCameraPermissionAndStart() {
      if (isEyeTrackingActive) {
        isEyeTrackingActive = false;
        document.getElementById('eyeTrackBtn').classList.remove('active');
        document.getElementById('gazePointer').classList.add('hidden');
        if (typeof webgazer !== 'undefined') webgazer.end();
        clearDwellTimer();
        return;
      }

      document.getElementById('permissionModal').classList.remove('hidden');
    }

    function cancelCameraPermission() {
      document.getElementById('permissionModal').classList.add('hidden');
    }

    async function confirmCameraPermission() {
      document.getElementById('permissionModal').classList.add('hidden');

      try {
        await navigator.mediaDevices.getUserMedia({ video: true });
        
        isEyeTrackingActive = true;
        document.getElementById('eyeTrackBtn').classList.add('active');
        document.getElementById('gazePointer').classList.remove('hidden');

        startEyeTracker();
      } catch (err) {
        alert("Camera permission was denied. Please allow camera access in browser settings to use Eye Tracking.");
      }
    }

    function startEyeTracker() {
      if (typeof webgazer === 'undefined') {
        alert("WebGazer script loading... Try again in a moment.");
        return;
      }

      webgazer.setGazeListener((data) => {
        // Prevent top-left lock (0,0 or null predictions)
        if (!data || (data.x === 0 && data.y === 0)) return;
        updateGazePointer(data.x, data.y);
        handleGaze(data.x, data.y);
      }).begin();

      webgazer.showVideoPreview(true);
      webgazer.showPredictionPoints(true);
      startCalibration();
    }

    function updateGazePointer(x, y) {
      const pointer = document.getElementById('gazePointer');
      pointer.style.left = `${x}px`;
      pointer.style.top = `${y}px`;
    }

    function handleGaze(x, y) {
      const element = document.elementFromPoint(x, y);
      const targetCard = element ? element.closest('.comm-card, .quick-btn, .tab-btn, .action-icon-btn') : null;

      if (targetCard !== currentGazeElement) {
        clearDwellTimer();

        if (targetCard) {
          currentGazeElement = targetCard;
          targetCard.classList.add('dwelling');
          
          dwellTimer = setTimeout(() => {
            targetCard.click();
            clearDwellTimer();
          }, dwellDuration);
        }
      }
    }

    function clearDwellTimer() {
      if (dwellTimer) {
        clearTimeout(dwellTimer);
        dwellTimer = null;
      }
      if (currentGazeElement) {
        currentGazeElement.classList.remove('dwelling');
        currentGazeElement = null;
      }
    }

    // 5-Point Calibration with Explicit WebGazer Training
    function startCalibration() {
      document.getElementById('calibrationOverlay').classList.remove('hidden');
      document.querySelectorAll('.calib-dot').forEach(dot => {
        dot.setAttribute('data-count', '5');
        dot.innerText = '5';
        dot.classList.remove('done');
      });
    }

    function clickCalibDot(dot, event) {
      // Record exact coordinate into WebGazer ML Model
      if (typeof webgazer !== 'undefined' && event) {
        webgazer.recordScreenPosition(event.clientX, event.clientY, 'click');
      }

      let count = parseInt(dot.getAttribute('data-count') || '5') - 1;
      dot.setAttribute('data-count', count);

      if (count <= 0) {
        dot.innerText = '✓';
        dot.classList.add('done');
      } else {
        dot.innerText = count;
      }
    }

    function finishCalibration() {
      document.getElementById('calibrationOverlay').classList.add('hidden');
      if (typeof webgazer !== 'undefined') {
        webgazer.showVideoPreview(false);
        webgazer.showPredictionPoints(false);
      }
    }

    // Auto Scanning
    function toggleAutoScan() {
      isAutoScanning = !isAutoScanning;
      const btn = document.getElementById('scanBtn');
      if (isAutoScanning) {
        btn.classList.add('active');
        document.body.classList.add('scanning-active');
        scanIndex = 0;
        runAutoScan();
        scanInterval = setInterval(runAutoScan, scanSpeed);
      } else {
        btn.classList.remove('active');
        document.body.classList.remove('scanning-active');
        clearInterval(scanInterval);
        document.querySelectorAll('.scan-focused').forEach(el => el.classList.remove('scan-focused'));
      }
    }

    function runAutoScan() {
      const focusable = Array.from(document.querySelectorAll('.quick-btn, .comm-card, .tab-btn'));
      if (!focusable.length) return;

      document.querySelectorAll('.scan-focused').forEach(el => el.classList.remove('scan-focused'));
      scanIndex = scanIndex % focusable.length;
      focusable[scanIndex].classList.add('scan-focused');
      scanIndex++;
    }

    document.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Enter') && isAutoScanning) {
        e.preventDefault();
        const activeEl = document.querySelector('.scan-focused');
        if (activeEl) activeEl.click();
      }
    });

    // Modal & Theme Controls
    function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
    function toggleHighContrast() { document.body.classList.toggle('high-contrast'); }
    function updateDwellTime(val) {
      dwellDuration = parseInt(val);
      document.styleSheets[0].insertRule(`:root { --dwell-duration: ${dwellDuration}ms; }`, 0);
    }
  </script>
</body>
</html>

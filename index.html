<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AAC Expressive Communication Assistant</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- WebGazer.js Eye Tracking Library -->
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

  <style>
    :root {
      --bg-primary: #f0f4f8;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --focus-ring: #2563eb;
      --card-radius: 18px;
      
      --color-yes: #22c55e;
      --color-no: #ef4444;
      --color-maybe: #f59e0b;
      --color-wait: #8b5cf6;
      
      --dwell-border: #2563eb;
      --dwell-duration: 3000ms;
    }

    body.high-contrast {
      --bg-primary: #000000;
      --bg-card: #121212;
      --text-main: #ffffff;
      --text-muted: #e2e8f0;
      --border-color: #ffffff;
      --focus-ring: #ffff00;
      
      --color-yes: #00ff00;
      --color-no: #ff0000;
      --color-maybe: #ffaa00;
      --color-wait: #aa00ff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background-color: var(--bg-card);
      padding: 12px 20px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--focus-ring);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-toggle {
      background-color: var(--bg-primary);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-toggle.active {
      background-color: var(--focus-ring);
      color: #ffffff;
      border-color: var(--focus-ring);
    }

    /* Pinned Quick Response Bar */
    .quick-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--border-color);
    }

    .quick-btn {
      border: 3px solid transparent;
      border-radius: var(--card-radius);
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 18px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .quick-btn i { font-size: 2rem; pointer-events: none; }
    .quick-btn span { pointer-events: none; }
    .quick-btn.yes { background-color: var(--color-yes); }
    .quick-btn.no { background-color: var(--color-no); }
    .quick-btn.maybe { background-color: var(--color-maybe); }
    .quick-btn.wait { background-color: var(--color-wait); }

    /* Message Display Banner */
    .message-banner {
      background-color: var(--bg-card);
      margin: 12px 14px 0 14px;
      padding: 14px 18px;
      border-radius: var(--card-radius);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
    }

    .message-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .message-actions {
      display: flex;
      gap: 8px;
    }

    .action-icon-btn {
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      position: relative;
    }

    /* Category Navigation Tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .tab-btn.active {
      border-color: var(--focus-ring);
      color: var(--focus-ring);
      background-color: rgba(37, 99, 235, 0.08);
    }

    /* Main Grid & Communication Cards */
    .cards-container {
      padding: 8px 14px 30px 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      flex: 1;
    }

    .comm-card {
      background-color: var(--bg-card);
      border: 3px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .comm-card i {
      font-size: 2.5rem;
      color: var(--focus-ring);
      pointer-events: none;
    }

    .comm-card span {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.2;
      pointer-events: none;
    }

    /* Visual Eye Target Pointer Symbol */
    #gazePointer {
      position: fixed;
      top: 0;
      left: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(236, 72, 153, 0.35);
      border: 3px solid #db2777;
      box-shadow: 0 0 16px rgba(219, 39, 119, 0.9);
      pointer-events: none !important;
      z-index: 999999;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.3rem;
      transition: transform 0.05s linear;
    }

    #gazePointer.hidden { display: none !important; }

    /* Dwell Ring Progress Indicator */
    .dwell-progress-ring {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none !important;
      border-radius: inherit;
      border: 8px solid transparent;
      box-sizing: border-box;
    }

    .dwelling .dwell-progress-ring {
      border-color: var(--dwell-border);
      animation: fillDwell var(--dwell-duration, 3000ms)
